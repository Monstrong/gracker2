syntax = "proto3";
package torrent.v1;
option go_package = "github.com/monstrong/gracker2/proto/gen/go/torrent/v1";

import "google/protobuf/timestamp.proto";
service TorrentService {
  rpc GetTorrent(GetTorrentRequest) returns (GetTorrentResponse);
  rpc CreateTorrent(CreateTorrentRequest) returns (CreateTorrentResponse);
  rpc DeleteTorrent(DeleteTorrentRequest) returns (DeleteTorrentResponse);
  rpc ListTorrents(ListTorrentsRequest) returns (ListTorrentsResponse);
  rpc UpdateTorrent(UpdateTorrentRequest) returns (UpdateTorrentResponse);
  rpc UpdateStatus(UpdateStatusRequest) returns (UpdateStatusResponse);
  rpc ListCategory(ListCategoryRequest) returns (ListCategoryResponse);
}

message ListCategoryRequest {}

message ListCategoryResponse {
  repeated Category categories = 1;
}

message UpdateTorrentRequest {
  string id = 1;
  optional string name = 2;
  optional string description = 3;
  optional string info_hash = 4;
  optional string category_id = 5;
}

message UpdateTorrentResponse {
 Torrent torrent = 1;
}

message UpdateStatusRequest {
  string torrent_id = 1;
  int32 new_status = 2;
}

message UpdateStatusResponse {
  bool updated = 1;
}

message GetTorrentRequest {
  string id = 1;
}

message GetTorrentResponse {
  Torrent torrent = 1;
}

message ListTorrentsRequest {
  int32 limit  = 1;
  int32 offset = 2;
}

message ListTorrentsResponse {
  repeated Torrent torrents = 1;
}

message CreateTorrentRequest {
  string name        = 1;
  string description = 2;
  string info_hash   = 3;
  string author_id   = 4;
  string category_id = 5;
}

message CreateTorrentResponse {
  Torrent torrent = 1;
}

message DeleteTorrentRequest {
  string id = 1;
}

message DeleteTorrentResponse {
  bool deleted = 1;
}

message Category {
  string id   = 1;
  string name = 2;
  optional string parent_id = 3;
}
message Torrent {
  string                    id          = 1;
  string                    name        = 2;
  string                    description = 3;
  string                    info_hash   = 4;
  string                    author_id   = 5;
  string                    category_id = 6;
  int32                     status      = 7;
  int64                     downloads   = 8;
  google.protobuf.Timestamp created_at  = 9;
  google.protobuf.Timestamp updated_at  = 10;
}

grpc:
  name: auth-service
  port: 50051
  timeout: 5s
infra:
  name: infra
  port: 8080
  timeout: 5s
postgres:
  host: localhost
  port: 5432
  user: postgres
  dbname: gracker_users
  max_conns: 10
  ssl_mode: disable
logger:
  level: local
GracefulShutdownTimeout: 15s
hasher:
  cost: 10
jwt:
  access_token_ttl: 15m
  refresh_token_ttl: 24h